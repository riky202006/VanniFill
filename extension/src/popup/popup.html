<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VaaniFill AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <span class="popup-mark"></span>
      <h1 class="popup-title">VAANIFILL <span>AI</span></h1>
    </header>

    <div class="popup-content">
      <p class="popup-desc">Click below to detect and autofill form fields on this page.</p>
      <button id="autofill-btn" class="popup-btn" type="button">Autofill Form</button>
    </div>

    <footer class="popup-footer">
      <span id="status-text">Ready</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
